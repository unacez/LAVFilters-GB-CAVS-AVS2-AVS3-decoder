name: Build LAVFilters 32-bit Windows Package

on:
  push:
    branches: [ "main", "develop", "release/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_NUMBER: ${{ github.run_number }}
  PROJECT_NAME: LAVFilters

jobs:
  build-32bit:
    runs-on: windows-2019
    strategy:
      matrix:
        configuration: [Release]
        platform: [Win32]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2
      with:
        nuget-version: 'latest'

    - name: Install dependencies
      run: |
        choco install wget
        choco install yasm

    - name: Restore NuGet packages
      run: nuget restore LAVFilters.sln

    - name: Build LAVFilters 32-bit
      run: |
        msbuild LAVFilters.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /p:PlatformToolset=v142

    - name: Prepare artifacts
      run: |
        mkdir artifacts
        if (Test-Path "bin_win32\LAVAudio.ax") { Copy-Item "bin_win32\LAVAudio.ax" artifacts\ }
        if (Test-Path "bin_win32\LAVVideo.ax") { Copy-Item "bin_win32\LAVVideo.ax" artifacts\ }
        if (Test-Path "bin_win32\LAVSplitter.ax") { Copy-Item "bin_win32\LAVSplitter.ax" artifacts\ }
        Copy-Item "README.txt" "artifacts\"
        Copy-Item "CHANGELOG.txt" "artifacts\"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LAVFilters-32bit-${{ github.sha }}
        path: artifacts/

  build-ffmpeg-cross-compile:
    runs-on: ubuntu-20.04
    strategy:
      matrix:
        arch: [x86]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup cross-compilation environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          pkg-config \
          yasm \
          nasm \
          mingw-w64 \
          mingw-w64-dev \
          libgnutls28-dev \
          libgmp-dev \
          libdav1d-dev \
          libspeex-dev \
          libopencore-amrnb-dev \
          libopencore-amrwb-dev \
          libxml2-dev \
          zlib1g-dev

    - name: Build ffmpeg for Windows
      run: |
        # Since the project has specific build scripts for AVS2/AVS3 support
        if [ "${{ matrix.arch }}" = "x86" ]; then
          # First ensure we have the correct path setup
          cd ffmpeg
          ./configure \
            --enable-shared \
            --disable-static \
            --enable-gpl \
            --enable-version3 \
            --enable-w32threads \
            --disable-demuxer=matroska \
            --disable-filters \
            --enable-filter=scale,yadif,w3fdif \
            --disable-protocol=async,cache,concat,httpproxy,icecast,md5,subfile \
            --disable-muxers \
            --enable-muxer=spdif \
            --disable-bsfs \
            --enable-bsf=extract_extradata,vp9_superframe_split \
            --disable-cuda \
            --disable-cuvid \
            --disable-nvenc \
            --enable-libdav1d \
            --enable-libdavs2 \
            --enable-libspeex \
            --enable-libopencore-amrnb \
            --enable-libopencore-amrwb \
            --enable-avresample \
            --enable-avisynth \
            --disable-avdevice \
            --disable-postproc \
            --disable-swresample \
            --disable-encoders \
            --disable-devices \
            --disable-programs \
            --disable-debug \
            --disable-doc \
            --disable-schannel \
            --enable-gnutls \
            --enable-gmp \
            --build-suffix=-lav \
            --arch=i686 \
            --cpu=i686 \
            --enable-cross-compile \
            --cross-prefix=i686-w64-mingw32- \
            --target-os=mingw32 \
            --pkg-config=pkg-config \
            --extra-cflags="-fno-tree-vectorize -D_WIN32_WINNT=0x0600 -DWINVER=0x0600 -mmmx -msse -msse2 -mfpmath=sse -mstackrealign" \
            --extra-ldflags=""
          make -j$(nproc)
          cd ..
        fi

    - name: Upload ffmpeg libraries
      uses: actions/upload-artifact@v4
      with:
        name: ffmpeg-${{ matrix.arch }}-libs
        path: ffmpeg/bin_${{ matrix.arch }}/lib/

  package-release:
    needs: [build-32bit]
    runs-on: windows-2019
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: LAVFilters-32bit-${{ github.sha }}
        path: artifacts/

    - name: Create release package
      run: |
        # Create release package
        $tagName = $env:GITHUB_REF -replace 'refs/tags/', ''
        $releaseName = "LAVFilters-$tagName-x86"
        New-Item -ItemType Directory -Name $releaseName
        Copy-Item -Path "artifacts/*" -Destination $releaseName -Recurse
        Compress-Archive -Path $releaseName -DestinationPath "$releaseName.zip"

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./LAVFilters-${{ github.ref_name }}-x86.zip
        asset_name: LAVFilters-${{ github.ref_name }}-x86.zip
        asset_content_type: application/zip