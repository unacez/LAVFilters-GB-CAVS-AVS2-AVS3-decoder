name: Build LAV Filters

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-ffmpeg:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86, x64]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-yasm
          make
          autoconf
          automake
          libtool
          pkg-config

    - name: Setup Visual Studio Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}

    - name: Prepare directory structure
      run: |
        mkdir -p thirdparty/32/lib
        mkdir -p thirdparty/32/include
        mkdir -p thirdparty/64/lib
        mkdir -p thirdparty/64/include
      shell: bash

    - name: Build FFmpeg for ${{ matrix.arch }}
      run: |
        if [ "${{ matrix.arch }}" = "x86" ]; then
          export CC="i686-w64-mingw32-gcc"
          export CXX="i686-w64-mingw32-g++"
          ./build_ffmpeg.sh x86
        else
          export CC="x86_64-w64-mingw32-gcc"
          export CXX="x86_64-w64-mingw32-g++"
          ./build_ffmpeg.sh x64
        fi
      shell: bash

    - name: Upload FFmpeg artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ffmpeg-${{ matrix.arch }}
        path: |
          bin_*/lib/
          ffmpeg/

  build-libbluray:
    needs: build-ffmpeg
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86, x64]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup libbluray if needed
      run: |
        # Check if libbluray/config.h exists, if not clone the correct repository
        if [ ! -f "libbluray/config.h" ]; then
          echo "libbluray/config.h not found, cloning libbluray repository"
          rm -rf libbluray
          # Try alternative URLs for the libbluray repository
          if git clone https://gitea.1f0.de/dekkers/libbluray.git libbluray; then
            echo "Successfully cloned from gitea.1f0.de"
          else
            echo "Failed to clone from gitea.1f0.de"
            exit 1
          fi
        else
          echo "libbluray/config.h already exists"
        fi
        
        # Verify config.h exists
        if [ ! -f "libbluray/config.h" ]; then
          echo "ERROR: Libbluray/config.h still not found after clone"
          ls -la libbluray/
          exit 1
        fi
      shell: bash

    - name: Download FFmpeg artifacts
      uses: actions/download-artifact@v4
      with:
        name: ffmpeg-${{ matrix.arch }}
        path: .

    - name: Setup Visual Studio Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}

    - name: Check libbluray config.h
      run: |
        # Verify that config.h exists in the libbluray directory
        if (Test-Path "libbluray/config.h") {
          echo "config.h exists in libbluray directory"
          Get-Content "libbluray/config.h" | Select-Object -First 5
        } else {
          echo "ERROR: config.h does not exist in libbluray directory"
          exit 1
        }
      shell: pwsh

    - name: Patch libbluray project for config.h
      run: |
        # Replace $(ProjectDir) with absolute path to ensure config.h is found
        $projectFile = "libbluray/libbluray.vcxproj"
        $content = Get-Content $projectFile
        $absolutePath = Resolve-Path "libbluray"
        $content = $content -replace '\$\(ProjectDir\)', "$absolutePath\"
        $content | Set-Content $projectFile
      shell: pwsh

    - name: Build libbluray for ${{ matrix.arch }}
      run: |
        if [ "${{ matrix.arch }}" = "x86" ]; then
          msbuild libbluray/libbluray.vcxproj /m /p:Configuration=Release /p:Platform=Win32
        else
          msbuild libbluray/libbluray.vcxproj /m /p:Configuration=Release /p:Platform=x64
        fi
      shell: bash

    - name: Upload libbluray artifacts
      uses: actions/upload-artifact@v4
      with:
        name: libbluray-${{ matrix.arch }}
        path: |
          bin_*/lib/
          libbluray/

  build-lavfilters:
    needs: [build-ffmpeg, build-libbluray]
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86, x64]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: .

    - name: Setup Visual Studio Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}

    - name: Build LAV Filters with MSBuild
      run: |
        if [ "${{ matrix.arch }}" = "x86" ]; then
          msbuild LAVFilters.sln /m /t:Rebuild /property:Configuration=Release,Platform=Win32
        else
          msbuild LAVFilters.sln /m /t:Rebuild /property:Configuration=Release,Platform=x64
        fi
      shell: bash

    - name: Upload LAV Filters artifacts
      uses: actions/upload-artifact@v4
      with:
        name: lav-filters-${{ matrix.arch }}
        path: |
          bin_*/**/*
          bin_*d/**/*

  package:
    needs: build-lavfilters
    runs-on: ubuntu-latest
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4

    - name: Package release
      run: |
        mkdir -p LAV-Filters-Build
        cp -r lav-filters-*/* LAV-Filters-Build/ 2>/dev/null || true
        tar -czf LAV-Filters-Build.tar.gz LAV-Filters-Build/

    - name: Upload release package
      uses: actions/upload-artifact@v4
      with:
        name: LAV-Filters-Complete-Package
        path: LAV-Filters-Build.tar.gz

