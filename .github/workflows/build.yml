name: Build LAV Filters

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-32bit:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Update submodules
      run: |
        echo "Checking submodule status..."
        git submodule status
        echo "Initializing and updating submodules..."
        git submodule update --init --recursive
        echo "Verifying directories after submodule update..."
        dir
      shell: cmd

    - name: Install dependencies
      run: |
        # 安装yasm等依赖
        choco install yasm

    - name: Build 32-bit package
      run: |
        # 验证ffmpeg目录是否存在
        echo "Checking if ffmpeg directory exists..."
        if exist ffmpeg (
          echo "ffmpeg directory exists"
          dir ffmpeg
        ) else (
          echo "ffmpeg directory does NOT exist"
          echo "Current directory contents:"
          dir
        )

        # 查找并设置VS环境变量
        for /f "usebackq tokens=*" %%i in (`call "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -version "[15.0,18.0)" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
          set VSInstallDir=%%i
        )

        if defined VSInstallDir (
          set "VSCMD_START_DIR=%CD%"
          call "%VSInstallDir%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x86 > NUL
        ) else (
          echo "Visual Studio not found!"
          exit 1
        )

        # 编译FFmpeg 32位
        echo "Starting FFmpeg build..."
        sh build_ffmpeg.sh x86 || EXIT /B 1

        # 编译LAV Filters 32位
        echo "Starting LAV Filters build..."
        MSBuild.exe LAVFilters.sln /nologo /m /t:Rebuild /property:Configuration=Release;Platform=Win32
      shell: cmd

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: lavfilters-32bit
        path: bin_Win32/*
