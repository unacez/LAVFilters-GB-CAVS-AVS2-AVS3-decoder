name: Build LAV Filters

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-32bit:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        # 安装yasm等依赖
        choco install yasm

    - name: Build 32-bit package
      run: |
        # 设置VS环境变量
        call "%ProgramFiles(x86)%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x86

        # 编译FFmpeg 32位
        sh build_ffmpeg.sh x86

        # 编译LAV Filters 32位
        MSBuild.exe LAVFilters.sln /nologo /m /t:Rebuild /property:Configuration=Release;Platform=Win32

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: lavfilters-32bit
        path: bin_Win32/*
