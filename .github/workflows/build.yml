name: Build LAVFilters 32-bit Windows Package

on:
  push:
    branches: [ "main", "develop", "release/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_NUMBER: ${{ github.run_number }}
  PROJECT_NAME: LAVFilters

jobs:
  build-ffmpeg-windows:
    runs-on: windows-2019
    strategy:
      matrix:
        arch: [x86]
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2
      with:
        nuget-version: 'latest'

    - name: Install dependencies
      run: |
        choco install wget
        choco install yasm
        choco install msys2

    - name: Build FFmpeg for Windows
      run: |
        # Run the project's build script for FFmpeg
        sh build_ffmpeg_msvc.sh x86
        
    - name: Upload FFmpeg libraries
      uses: actions/upload-artifact@v4
      with:
        name: ffmpeg-${{ matrix.arch }}-libs
        path: |
          bin_Win32/lib/
          bin_Win32/*.dll
          bin_Win32d/lib/
          bin_Win32d/*.dll

  build-32bit:
    needs: [build-ffmpeg-windows]  # Make sure FFmpeg is built first
    runs-on: windows-2019
    strategy:
      matrix:
        configuration: [Release]
        platform: [Win32]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Download FFmpeg libraries
      uses: actions/download-artifact@v4
      with:
        name: ffmpeg-x86-libs
        path: .

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2
      with:
        nuget-version: 'latest'

    - name: Install dependencies
      run: |
        choco install wget
        choco install yasm

    - name: Restore NuGet packages
      run: nuget restore LAVFilters.sln

    - name: Build LAVFilters 32-bit
      run: |
        msbuild LAVFilters.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /p:PlatformToolset=v142

    - name: Prepare artifacts
      run: |
        mkdir artifacts
        if (Test-Path "bin_win32\LAVAudio.ax") { Copy-Item "bin_win32\LAVAudio.ax" artifacts\ }
        if (Test-Path "bin_win32\LAVVideo.ax") { Copy-Item "bin_win32\LAVVideo.ax" artifacts\ }
        if (Test-Path "bin_win32\LAVSplitter.ax") { Copy-Item "bin_win32\LAVSplitter.ax" artifacts\ }
        Copy-Item "README.txt" "artifacts\"
        Copy-Item "CHANGELOG.txt" "artifacts\"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LAVFilters-32bit-${{ github.sha }}
        path: artifacts/

  build-ffmpeg-cross-compile:
    runs-on: ubuntu-20.04
    strategy:
      matrix:
        arch: [x86, x64]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup cross-compilation environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          pkg-config \
          yasm \
          nasm \
          mingw-w64 \
          mingw-w64-dev \
          libgnutls28-dev \
          libgmp-dev \
          libdav1d-dev \
          libspeex-dev \
          libopencore-amrnb-dev \
          libopencore-amrwb-dev \
          libxml2-dev \
          zlib1g-dev

    - name: Build ffmpeg for Windows
      run: |
        # Since the project has specific build scripts for AVS2/AVS3 support
        if [ "${{ matrix.arch }}" = "x86" ]; then
          # Build using project's script for 32-bit
          sh build_ffmpeg_avs23_x86.sh
        elif [ "${{ matrix.arch }}" = "x64" ]; then
          # Build using project's script for 64-bit
          sh build_ffmpeg_avs23_x64.sh
        fi

    - name: Upload ffmpeg libraries
      uses: actions/upload-artifact@v4
      with:
        name: ffmpeg-${{ matrix.arch }}-libs
        path: |
          bin_*/lib/
          bin_*/*.dll

  build-64bit:
    needs: [build-ffmpeg-cross-compile]  # Use Linux-built FFmpeg libs
    runs-on: windows-2019
    strategy:
      matrix:
        configuration: [Release]
        platform: [x64]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Download FFmpeg libraries (64-bit)
      uses: actions/download-artifact@v4
      with:
        name: ffmpeg-x64-libs
        path: .

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2
      with:
        nuget-version: 'latest'

    - name: Install dependencies
      run: |
        choco install wget
        choco install yasm

    - name: Restore NuGet packages
      run: nuget restore LAVFilters.sln

    - name: Build LAVFilters 64-bit
      run: |
        msbuild LAVFilters.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /p:PlatformToolset=v142

    - name: Prepare artifacts
      run: |
        mkdir artifacts_x64
        if (Test-Path "bin_x64\LAVAudio.ax") { Copy-Item "bin_x64\LAVAudio.ax" artifacts_x64\ }
        if (Test-Path "bin_x64\LAVVideo.ax") { Copy-Item "bin_x64\LAVVideo.ax" artifacts_x64\ }
        if (Test-Path "bin_x64\LAVSplitter.ax") { Copy-Item "bin_x64\LAVSplitter.ax" artifacts_x64\ }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LAVFilters-64bit-${{ github.sha }}
        path: artifacts_x64/

  package-release:
    needs: [build-32bit, build-64bit]
    runs-on: windows-2019
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download 32-bit artifacts
      uses: actions/download-artifact@v4
      with:
        name: LAVFilters-32bit-${{ github.sha }}
        path: artifacts_32/
        
    - name: Download 64-bit artifacts
      uses: actions/download-artifact@v4
      with:
        name: LAVFilters-64bit-${{ github.sha }}
        path: artifacts_64/

    - name: Create release package
      run: |
        # Create release package
        $tagName = $env:GITHUB_REF -replace 'refs/tags/', ''
        $releaseName = "LAVFilters-$tagName"
        New-Item -ItemType Directory -Name $releaseName
        
        # Create directories for both architectures
        New-Item -ItemType Directory -Name "$releaseName\x86"
        New-Item -ItemType Directory -Name "$releaseName\x64"
        
        # Copy 32-bit files to x86 folder
        Copy-Item -Path "artifacts_32/*" -Destination "$releaseName\x86" -Recurse
        # Copy 64-bit files to x64 folder
        Copy-Item -Path "artifacts_64/*" -Destination "$releaseName\x64" -Recurse
        # Copy documentation to main folder
        Copy-Item "README.txt" "$releaseName\"
        Copy-Item "CHANGELOG.txt" "$releaseName\"
        
        Compress-Archive -Path $releaseName -DestinationPath "$releaseName.zip"

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./LAVFilters-${{ github.ref_name }}.zip
        asset_name: LAVFilters-${{ github.ref_name }}.zip
        asset_content_type: application/zip